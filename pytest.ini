[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -m "not hardware and not integration"
markers =
    hardware: tests that require a physical device to be connected (excluded from CI)
    integration: tests that require a physical device to be connected (excluded from CI)
    ionvision: tests for the IonVision integration
