name: Unit Tests and Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        id: tests
        run: |
          set -o pipefail
          python -m pytest \
            -m "not hardware and not integration" \
            --junitxml=pytest-report.xml \
            --cov=app \
            --cov-report=xml \
            --cov-report=html:htmlcov \
            --cov-report=term-missing \
            2>&1 | tee pytest-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-py3.12
          path: htmlcov
          retention-days: 21

      - name: Add compact test summary
        if: always()
        env:
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
          PYTHON_VERSION: "3.12"
        run: |
          python - <<'PY'
          import os
          import pathlib
          import xml.etree.ElementTree as ET

          tests = failures = errors = skipped = 0
          passed_test_names = []
          failed_test_names = []
          junit_path = pathlib.Path("pytest-report.xml")
          if junit_path.exists():
              root = ET.parse(junit_path).getroot()
              suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
              for suite in suites:
                  tests += int(suite.attrib.get("tests", 0))
                  failures += int(suite.attrib.get("failures", 0))
                  errors += int(suite.attrib.get("errors", 0))
                  skipped += int(suite.attrib.get("skipped", 0))
                  for case in suite.findall("testcase"):
                      classname = case.attrib.get("classname", "")
                      name = case.attrib.get("name", "unknown")
                      test_id = f"{classname}::{name}" if classname else name
                      
                      has_failure = case.find("failure") is not None
                      has_error = case.find("error") is not None
                      has_skip = case.find("skipped") is not None
                      
                      if has_failure or has_error:
                          failed_test_names.append(test_id)
                      elif not has_skip:
                          passed_test_names.append(test_id)

          passed = max(tests - failures - errors - skipped, 0)

          coverage_pct = "N/A"
          coverage_value = None
          coverage_path = pathlib.Path("coverage.xml")
          if coverage_path.exists():
              coverage_root = ET.parse(coverage_path).getroot()
              line_rate = coverage_root.attrib.get("line-rate")
              if line_rate is not None:
                  coverage_value = float(line_rate) * 100
                  coverage_pct = f"{coverage_value:.2f}%"

          exit_code = os.environ.get("TEST_EXIT_CODE", "1")
          status = "PASSED" if exit_code == "0" else "FAILED"
          status_emoji = "✅" if exit_code == "0" else "❌"
          py_ver = os.environ.get("PYTHON_VERSION", "3.12")
          run_url = (
              f"{os.environ.get('GITHUB_SERVER_URL', 'https://github.com')}/"
              f"{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/"
              f"{os.environ.get('GITHUB_RUN_ID')}"
            )

          coverage_bar = "N/A"
          coverage_emoji = "📊"
          if coverage_value is not None:
              if coverage_value >= 80:
                  coverage_emoji = "🟢"
              elif coverage_value >= 60:
                  coverage_emoji = "🟡"
              else:
                  coverage_emoji = "🔴"
              filled = int(round(coverage_value / 10))
              filled = max(0, min(10, filled))
              coverage_bar = f"{'█' * filled}{'░' * (10 - filled)} {coverage_pct}"

          summary_path = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary_path.open("a", encoding="utf-8") as f:
              f.write("## Test Results\n\n")
              f.write("| Item | Value |\n")
              f.write("|---|---:|\n")
              f.write(f"| {status_emoji} Status | **{status}** |\n")
              f.write(f"| 🐍 Python | `{py_ver}` |\n")
              f.write(f"| 📋 Total | `{tests}` |\n")
              f.write(f"| ✅ Passed | `{passed}` |\n")
              f.write(f"| ❌ Failed | `{failures}` |\n")
              f.write(f"| ⚠️ Errors | `{errors}` |\n")
              f.write(f"| ⊘ Skipped | `{skipped}` |\n")
              f.write(f"| {coverage_emoji} Coverage | {coverage_bar} |\n")
              f.write("| 📦 Artifact | `coverage-html-py3.12` |\n")

              if passed > 0 or failed_test_names or skipped > 0:
                  f.write("\n<details>\n")
                  f.write(f"<summary><strong>📝 Test Details</strong></summary>\n\n")
                  
                  if passed > 0:
                      f.write("#### ✅ Passed Tests\n")
                      for test_name in passed_test_names:
                          f.write(f"- `{test_name}`\n")
                      f.write("\n")
                  
                  if failed_test_names:
                      f.write("#### ❌ Failed Tests\n")
                      for test_name in failed_test_names[:10]:
                          f.write(f"- `{test_name}`\n")
                      if len(failed_test_names) > 10:
                          f.write(f"- ... and {len(failed_test_names) - 10} more\n")
                      f.write("\n")
                  
                  if skipped > 0:
                      f.write("#### ⊘ Skipped Tests\n")
                      f.write(f"`{skipped} test(s) skipped`\n\n")
                  
                  f.write("</details>\n")

              comment_path = pathlib.Path("pr-test-comment.md")
              with comment_path.open("w", encoding="utf-8") as f:
                  f.write("<!-- test-results-bot -->\n")
                  f.write("## Test Results\n\n")
                  f.write(f"{status_emoji} **{status}** on Python {py_ver}.\n\n")
                  f.write(
                      f"- Quick stats: {passed} passed, {failures} failed, {errors} errors, {skipped} skipped\\n"
                  )
                  f.write(f"- Coverage: {coverage_bar}\\n")
                  f.write(f"- View full Job Summary and logs: {run_url}\\n")
                  f.write("> This comment updates automatically on each push to this PR.\n")
          PY

      - name: Comment test results on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'pr-test-comment.md';
            if (!fs.existsSync(path)) {
              core.warning('pr-test-comment.md not found, skipping PR comment');
              return;
            }

            const body = fs.readFileSync(path, 'utf8');
            const marker = '<!-- test-results-bot -->';
            const issue_number = context.payload.pull_request.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }

      - name: Add failure excerpt to summary
        if: always() && steps.tests.outputs.exit_code != '0'
        run: |
          {
            echo ""
            echo "<details>"
            echo "<summary><strong>Failure log excerpt (last 80 lines)</strong></summary>"
            echo ""
            echo '```text'
            tail -n 80 pytest-output.txt || true
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if tests failed
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
