<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nenabot — Job Results</title>
    <style>
        :root {
            --bg: #1e1e2e;
            --card: #282840;
            --border: #3a3a5c;
            --fg: #cdd6f4;
            --dim: #888;
            --accent: #89b4fa;
            --green: #a6e3a1;
            --red: #f38ba8;
            --orange: #fab387;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, sans-serif;
            background: var(--bg);
            color: var(--fg);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 12px 20px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        header h1 {
            font-size: 16px;
            font-weight: 600;
        }

        #apiUrl {
            background: var(--bg);
            color: var(--fg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 13px;
            width: 260px;
        }

        button {
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 4px;
            padding: 6px 14px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            filter: brightness(1.15);
        }

        .content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ---- left panel: job list ---- */
        .job-list {
            width: 280px;
            min-width: 220px;
            border-right: 1px solid var(--border);
            background: var(--card);
            overflow-y: auto;
        }

        .job-list-hdr {
            padding: 10px 12px;
            font-weight: 600;
            font-size: 13px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .job-item {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            font-size: 13px;
        }

        .job-item:hover {
            background: rgba(137, 180, 250, .08);
        }

        .job-item.active {
            background: rgba(137, 180, 250, .15);
            border-left: 3px solid var(--accent);
        }

        .job-item .jid {
            font-family: monospace;
            color: var(--accent);
        }

        .job-item .jmeta {
            font-size: 11px;
            color: var(--dim);
            margin-top: 2px;
        }

        .status-pill {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 6px;
        }

        .state-created {
            background: var(--border);
            color: var(--fg);
        }

        .state-running {
            background: var(--orange);
            color: #000;
        }

        .state-completed {
            background: var(--green);
            color: #000;
        }

        .state-failed {
            background: var(--red);
            color: #000;
        }

        .state-stopped {
            background: var(--dim);
            color: #fff;
        }

        /* ---- right panel: detail ---- */
        .detail {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .detail-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--dim);
            font-size: 14px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .card-hdr {
            padding: 8px 12px;
            font-weight: 600;
            font-size: 13px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-body {
            padding: 10px 12px;
        }

        #overlayImg {
            display: none;
        }

        .image-container {
            position: relative;
            width: 100%;
        }

        .image-container img {
            width: 100%;
            display: block;
            border-radius: 4px;
            background: #111;
        }

        .image-container canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 4px;
            pointer-events: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th,
        td {
            text-align: left;
            padding: 4px 8px;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--dim);
            font-weight: 600;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            font-size: 13px;
        }

        .meta-grid dt {
            color: var(--dim);
            font-size: 11px;
        }

        .meta-grid dd {
            margin: 0 0 6px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Nenabot — Job Results</h1>
        <input id="apiUrl" type="text" value="http://localhost:8000" placeholder="API base URL" />
        <button onclick="loadJobs()">Refresh</button>
    </header>

    <div class="content">
        <!-- Job list -->
        <div class="job-list">
            <div class="job-list-hdr"><span>Jobs</span></div>
            <div id="jobListItems"></div>
        </div>

        <!-- Detail panel -->
        <div class="detail" id="detailPanel">
            <div class="detail-empty">Select a job to view results</div>
        </div>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        const api = () => $('apiUrl').value.replace(/\/+$/, '') + '/api';
        let selectedJobId = null;
        let autoTimer = null;
        let currentJobs = [];

        function jobPath(jobId = '') {
            const suffix = jobId ? `/${encodeURIComponent(jobId)}` : '';
            return `${api()}/job${suffix}`;
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function formatNumber(value, digits = 1) {
            return typeof value === 'number' ? value.toFixed(digits) : '—';
        }

        function formatTimestamp(value) {
            if (!value) return '—';
            const parsed = new Date(value);
            return Number.isNaN(parsed.valueOf()) ? escapeHtml(value) : parsed.toLocaleString();
        }

        function renderListMessage(message) {
            $('jobListItems').innerHTML = `<div class="job-item" style="cursor:default;color:var(--dim)">${escapeHtml(message)}</div>`;
        }

        function renderDetailMessage(message) {
            $('detailPanel').innerHTML = `<div class="detail-empty">${escapeHtml(message)}</div>`;
        }

        function stopAutoRefresh() {
            clearInterval(autoTimer);
            autoTimer = null;
        }

        function highlightSelectedJob() {
            document.querySelectorAll('.job-item').forEach(el => {
                el.classList.toggle('active', el.dataset.jobId === selectedJobId);
            });
        }

        async function loadJobs() {
            try {
                const res = await fetch(jobPath());
                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}`);
                }
                const jobs = await res.json();
                currentJobs = Array.isArray(jobs) ? jobs.slice().reverse() : [];
                const container = $('jobListItems');
                container.innerHTML = '';
                if (currentJobs.length === 0) {
                    selectedJobId = null;
                    stopAutoRefresh();
                    renderListMessage('No jobs found');
                    renderDetailMessage('No jobs yet');
                    return;
                }

                let selectedExists = false;
                for (const j of currentJobs) {
                    if (j.id === selectedJobId) selectedExists = true;
                    const s = j.status || {};
                    const div = document.createElement('div');
                    div.className = 'job-item' + (j.id === selectedJobId ? ' active' : '');
                    div.dataset.jobId = j.id;
                    div.innerHTML = `
        <span class="jid">${j.id.slice(0, 8)}…</span>
        <span class="status-pill state-${s.state || 'created'}">${(s.state || 'created').toUpperCase()}</span>
        <div class="jmeta">${j.path?.length || 0} pts · ${j.dryRun ? 'dry run' : 'real'}</div>
      `;
                    div.onclick = () => selectJob(j.id);
                    container.appendChild(div);
                }

                if (selectedJobId && !selectedExists) {
                    selectedJobId = null;
                    stopAutoRefresh();
                    renderDetailMessage('Select a job to view results');
                }
            } catch (e) {
                console.error('loadJobs', e);
                renderListMessage(`Failed to load jobs: ${e.message}`);
            }
        }

        async function selectJob(jobId) {
            stopAutoRefresh();
            selectedJobId = jobId;
            highlightSelectedJob();
            await renderDetail(jobId);
        }

        function startAutoRefresh() {
            stopAutoRefresh();
            autoTimer = setInterval(async () => {
                if (!selectedJobId) return;
                try {
                    const res = await fetch(jobPath(selectedJobId));
                    if (!res.ok) {
                        throw new Error(`HTTP ${res.status}`);
                    }
                    const job = await res.json();
                    if (['completed', 'failed', 'stopped'].includes(job.status?.state)) {
                        stopAutoRefresh();
                        await loadJobs();
                    }
                    await renderDetail(selectedJobId, job);
                } catch (e) {
                    console.error('autoRefresh', e);
                    stopAutoRefresh();
                }
            }, 1200);
        }

        function measurementRows(job) {
            let rows = '';
            for (const m of (job.measurements || [])) {
                const w = m.waypoint || {};
                const scan = m.scanResult ? JSON.stringify(m.scanResult).slice(0, 120) : '—';
                rows += `<tr>
        <td>${(m.waypointIndex ?? 0) + 1}</td>
        <td>${m.pixelX != null ? formatNumber(m.pixelX, 0) : '—'}</td>
        <td>${m.pixelY != null ? formatNumber(m.pixelY, 0) : '—'}</td>
        <td>${formatNumber(w.robotX)}</td><td>${formatNumber(w.robotY)}</td>
        <td>${formatNumber(w.robotZ)}</td><td>${formatNumber(w.robotR)}</td>
        <td>${m.simulated ? 'Yes' : 'No'}</td>
        <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(scan)}</td>
        <td>${formatTimestamp(m.timestamp)}</td>
      </tr>`;
            }
            return rows || '<tr><td colspan="10" style="color:var(--dim)">No measurements yet</td></tr>';
        }

        async function renderDetail(jobId, prefetchedJob = null) {
            try {
                const job = prefetchedJob || await (async () => {
                    const res = await fetch(jobPath(jobId));
                    if (!res.ok) {
                        if (res.status === 404) {
                            return null;
                        }
                        throw new Error(`HTTP ${res.status}`);
                    }
                    return await res.json();
                })();

                if (!job) {
                    stopAutoRefresh();
                    renderDetailMessage('Job not found');
                    return;
                }

                const s = job.status || {};
                const panel = $('detailPanel');
                const imgUrl = `${jobPath(jobId)}/image?t=${Date.now()}`;
                const options = job.options ? `<pre style="margin-top:10px;background:var(--bg);padding:8px;border-radius:4px;overflow:auto;font-size:12px;">${escapeHtml(JSON.stringify(job.options, null, 2))}</pre>` : '';

                panel.innerHTML = `
      <div class="detail-grid">
        <!-- Meta -->
        <div class="card">
          <div class="card-hdr">
            <span>Job ${jobId.slice(0, 8)}…</span>
            <span class="status-pill state-${s.state}">${(s.state || '?').toUpperCase()}</span>
          </div>
          <div class="card-body">
            <dl class="meta-grid">
              <div><dt>State</dt><dd>${escapeHtml(s.state || 'created')}</dd></div>
              <div><dt>Points</dt><dd>${s.lastPointProcessed ?? 0} / ${job.path?.length ?? 0}</dd></div>
              <div><dt>Mode</dt><dd>${job.dryRun ? 'Dry Run' : 'Real'}</dd></div>
            </dl>
            ${s.error ? `<div style="color:var(--red);margin-top:6px">Error: ${escapeHtml(s.error)}</div>` : ''}
            ${options ? `<div style="margin-top:8px;font-size:12px;color:var(--dim)">Options</div>${options}` : ''}
          </div>
        </div>

        <!-- Base image with measurement overlay -->
        <div class="card">
          <div class="card-hdr">Image</div>
          <div class="card-body" style="padding:0">
            <div class="image-container">
              <img id="baseImg" src="${imgUrl}" alt="base image"
                   onerror="this.style.display='none';document.getElementById('noImgMsg').style.display='block'"
                   onload="this.style.display='block';drawMeasurements()" />
              <canvas id="overlayCanvas"></canvas>
            </div>
            <div id="noImgMsg" style="padding:12px;color:var(--dim);font-size:13px;display:none">
              No image stored for this job
            </div>
          </div>
        </div>

        <!-- Measurements -->
        <div class="card">
          <div class="card-hdr">Measurements (${job.measurements?.length ?? 0})</div>
          <div class="card-body" style="padding:0;overflow-x:auto">
            <table>
              <thead><tr><th>#</th><th>Pixel X</th><th>Pixel Y</th><th>Robot X</th><th>Robot Y</th><th>Z</th><th>R</th><th>Sim</th><th>Scan Result</th><th>Time</th></tr></thead>
              <tbody>${measurementRows(job)}</tbody>
            </table>
          </div>
        </div>
      </div>
    `;

                // Draw measurement points on canvas after image loads
                window._currentMeasurements = job.measurements || [];
                const img = $('baseImg');
                if (img && img.complete && img.naturalWidth > 0) {
                    drawMeasurements();
                }

                if (s.state === 'running') {
                    startAutoRefresh();
                } else {
                    stopAutoRefresh();
                }
            } catch (e) {
                console.error('renderDetail', e);
                stopAutoRefresh();
                renderDetailMessage(`Failed to load job: ${e.message}`);
            }
        }

        function drawMeasurements() {
            const img = $('baseImg');
            const canvas = $('overlayCanvas');
            if (!img || !canvas || !img.naturalWidth) return;

            const measurements = window._currentMeasurements || [];
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;

            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (const m of measurements) {
                const px = m.pixelX;
                const py = m.pixelY;
                if (px == null || py == null) continue;

                // Green filled circle
                ctx.beginPath();
                ctx.arc(px, py, 10, 0, 2 * Math.PI);
                ctx.fillStyle = 'rgba(0, 220, 100, 0.85)';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Waypoint number
                const label = String((m.waypointIndex ?? 0) + 1);
                ctx.font = 'bold 11px sans-serif';
                ctx.fillStyle = '#000';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(label, px, py);
            }
        }

        // Initial load
        loadJobs();
    </script>
</body>

</html>
