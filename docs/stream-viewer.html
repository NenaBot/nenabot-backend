<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nenabot Stream Viewer</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #2f3946;
            --fg: #e6edf3;
            --dim: #9ba7b4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: ui-monospace, monospace;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            padding: 20px;
        }

        .shell {
            display: grid;
            gap: 16px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
        }

        .controls,
        .feeds {
            display: grid;
            gap: 16px;
        }

        .controls {
            grid-template-columns: 1fr auto;
            align-items: end;
        }

        .feeds {
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        }

        label {
            display: block;
            color: var(--dim);
            font-size: 12px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #1f2630;
            color: var(--fg);
        }

        button {
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #1f2630;
            color: var(--fg);
            cursor: pointer;
        }

        img {
            width: 100%;
            display: block;
            border-radius: 12px;
            background: #000;
        }

        p {
            color: var(--dim);
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <div class="shell">
        <div class="card">
            <h1>Nenabot Stream Viewer</h1>
            <p>Simple MJPEG viewer for the shared raw and detection streams. Use <code>docs/calibration-tester.html</code> for the guided 4-point calibration workflow.</p>
        </div>

        <div class="card controls">
            <div>
                <label for="apiUrl">API URL</label>
                <input id="apiUrl" type="text" value="http://localhost:8000" />
            </div>
            <button id="connectBtn">Connect</button>
        </div>

        <div class="feeds">
            <div class="card">
                <label>Raw Camera Stream</label>
                <img id="rawFeed" alt="raw stream" />
            </div>
            <div class="card">
                <label>Detection Stream</label>
                <img id="detectionFeed" alt="detection stream" />
            </div>
        </div>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);

        function api() {
            return $("apiUrl").value.replace(/\/+$/, "") + "/api";
        }

        function connect() {
            $("rawFeed").src = `${api()}/stream/camera/feed`;
            $("detectionFeed").src = `${api()}/stream/detection/feed`;
        }

        $("connectBtn").addEventListener("click", connect);
        connect();
    </script>
</body>

</html>
