<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nenabot — Job Tester</title>
    <style>
        :root {
            --bg: #1e1e2e;
            --card: #282840;
            --border: #3a3a5c;
            --fg: #cdd6f4;
            --dim: #888;
            --accent: #89b4fa;
            --green: #a6e3a1;
            --red: #f38ba8;
            --orange: #fab387;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, sans-serif;
            background: var(--bg);
            color: var(--fg);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 12px 20px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        header h1 {
            font-size: 16px;
            font-weight: 600;
        }

        #apiUrl {
            background: var(--bg);
            color: var(--fg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 13px;
            width: 260px;
        }

        main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 12px;
            flex: 1;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-hdr {
            padding: 8px 12px;
            font-weight: 600;
            font-size: 13px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-body {
            padding: 10px 12px;
            flex: 1;
            overflow: auto;
        }

        .stream-img {
            width: 100%;
            display: block;
            border-radius: 4px;
            background: #000;
            min-height: 160px;
        }

        button {
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 4px;
            padding: 6px 14px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            filter: brightness(1.15);
        }

        button.danger {
            background: var(--red);
        }

        button.secondary {
            background: var(--border);
            color: var(--fg);
        }

        button.tool-active {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .btn-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        label {
            font-size: 12px;
            color: var(--dim);
            display: block;
            margin-bottom: 2px;
        }

        input[type="number"] {
            background: var(--bg);
            color: var(--fg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 4px 6px;
            font-size: 13px;
            width: 80px;
        }

        .field-row {
            display: flex;
            gap: 12px;
            align-items: end;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .status-pill {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
        }

        .state-created {
            background: var(--border);
            color: var(--fg);
        }

        .state-running {
            background: var(--orange);
            color: #000;
        }

        .state-completed {
            background: var(--green);
            color: #000;
        }

        .state-failed {
            background: var(--red);
            color: #000;
        }

        .state-stopped {
            background: var(--dim);
            color: #fff;
        }

        #log {
            background: var(--bg);
            padding: 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            max-height: 220px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th,
        td {
            text-align: left;
            padding: 4px 8px;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--dim);
            font-weight: 600;
        }

        .full-span {
            grid-column: 1 / -1;
        }

        canvas {
            display: block;
            width: 100%;
            border-radius: 4px;
            background: #000;
        }

        .toolbar {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .toolbar .sep {
            width: 1px;
            height: 20px;
            background: var(--border);
            margin: 0 4px;
        }

        #confirmBanner {
            display: none;
            background: #352a1e;
            border: 1px solid var(--orange);
            border-radius: 6px;
            padding: 10px 14px;
            margin-top: 10px;
        }

        #confirmBanner .cb-title {
            font-weight: 600;
            color: var(--orange);
            margin-bottom: 6px;
        }

        #confirmBanner .cb-detail {
            font-size: 12px;
            color: var(--dim);
            margin-bottom: 8px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Nenabot — Job Tester</h1>
        <input id="apiUrl" type="text" value="http://localhost:8000" placeholder="API base URL" />
    </header>

    <main>
        <!-- Camera Feed -->
        <div class="card">
            <div class="card-hdr">Camera Feed</div>
            <div class="card-body">
                <img id="cameraFeed" class="stream-img" alt="camera feed" />
                <div class="btn-row">
                    <button onclick="toggleCamera()">Start</button>
                </div>
            </div>
        </div>

        <!-- Detection Overlay -->
        <div class="card">
            <div class="card-hdr">Detection Overlay</div>
            <div class="card-body">
                <img id="detectionFeed" class="stream-img" alt="detection overlay" />
                <div class="btn-row">
                    <button onclick="toggleDetection()">Start</button>
                </div>
            </div>
        </div>

        <!-- Path Planner (full span) -->
        <div class="card full-span">
            <div class="card-hdr">
                <span>Path Planner</span>
                <div class="toolbar">
                    <button onclick="detectPath()">Detect</button>
                    <div class="sep"></div>
                    <button id="toolMove" class="secondary tool-active" onclick="setTool('move')">Move</button>
                    <button id="toolAdd" class="secondary" onclick="setTool('add')">Add</button>
                    <button id="toolDelete" class="secondary" onclick="setTool('delete')">Delete</button>
                    <div class="sep"></div>
                    <button class="secondary" onclick="autoStartFromMarker()">Auto Start</button>
                    <button class="secondary" onclick="clearStartingPoint()">Clear Start</button>
                    <button class="secondary" onclick="clearAllWaypoints()">Clear Path</button>
                    <div class="sep"></div>
                    <button class="secondary" onclick="validateCoords()">Validate</button>
                    <button class="secondary" onclick="testMoveToWP()">Test Move</button>
                </div>
            </div>
            <div class="card-body">
                <canvas id="snapCanvas" width="1280" height="720"></canvas>
                <div id="pathInfo" style="margin-top:6px; font-size:12px; color:var(--dim);"></div>
            </div>
        </div>

        <!-- Job Controls -->
        <div class="card">
            <div class="card-hdr">Job Controls</div>
            <div class="card-body">
                <div class="field-row">
                    <div><label>Work Z</label><input id="workZ" type="number" value="0" step="0.1" /></div>
                    <div><label>Work R</label><input id="workR" type="number" value="0" step="0.1" /></div>
                </div>
                <div class="btn-row">
                    <button onclick="requestStart(false)">Start Job</button>
                    <button class="secondary" onclick="requestStart(true)">Dry Run</button>
                    <button class="danger" onclick="stopJob()">Stop</button>
                </div>

                <div id="confirmBanner">
                    <div class="cb-title">Confirm before launch</div>
                    <div class="cb-detail" id="confirmDetail"></div>
                    <div class="btn-row">
                        <button id="confirmBtn" onclick="confirmJob()">Confirm &amp; Start</button>
                        <button class="secondary" onclick="cancelConfirm()">Cancel</button>
                    </div>
                </div>

                <div style="margin-top:12px;">
                    <div id="jobStatus"></div>
                    <div id="jobProgress" style="margin-top:4px; font-size:12px; color:var(--dim);"></div>
                </div>
            </div>
        </div>

        <!-- Robot Start Position (robot mm coordinates) -->
        <div class="card">
            <div class="card-hdr">
                <span>Robot Start Position (mm)</span>
                <button onclick="readPose()">Read Position</button>
            </div>
            <div class="card-body">
                <p style="font-size:11px;color:var(--dim);margin-bottom:8px;">Robot arm coordinates — not pixels. Read
                    Position records where the arm is now.</p>
                <div class="field-row">
                    <div><label>X</label><input id="startX" type="number" value="" step="0.1" placeholder="—" /></div>
                    <div><label>Y</label><input id="startY" type="number" value="" step="0.1" placeholder="—" /></div>
                    <div><label>Z</label><input id="startZ" type="number" value="" step="0.1" placeholder="—" /></div>
                    <div><label>R</label><input id="startR" type="number" value="" step="0.1" placeholder="—" /></div>
                </div>
                <div class="btn-row">
                    <button class="secondary" onclick="clearRobotStart()">Clear</button>
                </div>
                <div id="poseInfo" style="margin-top:6px; font-size:12px; color:var(--dim);"></div>
            </div>
        </div>

        <!-- Measurements Table -->
        <div class="card full-span">
            <div class="card-hdr">Measurements</div>
            <div class="card-body">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>X</th>
                            <th>Y</th>
                            <th>Z</th>
                            <th>R</th>
                            <th>Simulated</th>
                            <th>Scan Result</th>
                            <th>Time</th>
                        </tr>
                    </thead>
                    <tbody id="measurementsBody"></tbody>
                </table>
            </div>
        </div>

        <!-- Log -->
        <div class="card full-span">
            <div class="card-hdr">
                <span>Log</span>
                <button class="secondary" onclick="document.getElementById('log').textContent=''">Clear</button>
            </div>
            <div class="card-body">
                <div id="log"></div>
            </div>
        </div>
    </main>

    <script>
        const $ = id => document.getElementById(id);
        const api = () => $('apiUrl').value.replace(/\/+$/, '');

        let cameraOn = false, detectionOn = false;
        let currentJobId = null, pollTimer = null;

        // Path state
        let detectedPath = [];       // [{x, y, z, r}, ...] in pixel coords
        let lastSnapshotImg = null;  // Image object of last detection snapshot
        let lastDetections = [];     // raw detection objects from last POST /paths
        let lastPixelsPerMm = null;  // scale factor
        let lastMarkerCorners = [];  // ArUco marker corner data

        // Two separate coordinate systems:
        // 1) Robot start position — mm in robot coordinate space (from Read Position)
        let robotStartPos = null;    // {x, y, z, r} or null
        // 2) Canvas start marker — pixel coordinates (from ArUco marker auto-start)
        let canvasStartPos = null;   // {x, y} or null
        // 3) ArUco marker pixel center (before 50 mm offset) — used as calibration anchor
        let markerPixelCenter = null; // {x, y} or null

        // Canvas interaction
        let activeTool = 'move';     // 'move' | 'add' | 'delete'
        let draggingIdx = -1;        // index into detectedPath while dragging
        let isDragging = false;

        // Confirmation state
        let pendingDryRun = false;

        function log(msg) {
            const el = $('log');
            el.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
            el.scrollTop = el.scrollHeight;
        }

        /* ---- Tool selection ---- */
        function setTool(tool) {
            activeTool = tool;
            for (const t of ['move', 'add', 'delete']) {
                const btn = $('tool' + t.charAt(0).toUpperCase() + t.slice(1));
                btn.classList.toggle('tool-active', t === tool);
            }
            const cv = $('snapCanvas');
            if (tool === 'add') cv.style.cursor = 'crosshair';
            else if (tool === 'delete') cv.style.cursor = 'not-allowed';
            else cv.style.cursor = 'grab';
        }

        /* ---- Canvas coordinate helpers ---- */
        function canvasCoords(e) {
            const cv = $('snapCanvas');
            const rect = cv.getBoundingClientRect();
            const scaleX = cv.width / rect.width;
            const scaleY = cv.height / rect.height;
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY,
            };
        }

        function findNearestWaypoint(cx, cy, threshold) {
            let bestDist = Infinity, bestIdx = -1;
            for (let i = 0; i < detectedPath.length; i++) {
                const dx = detectedPath[i].x - cx;
                const dy = detectedPath[i].y - cy;
                const d = Math.sqrt(dx * dx + dy * dy);
                if (d < bestDist) { bestDist = d; bestIdx = i; }
            }
            // Also check canvas start marker (index -1)
            if (canvasStartPos) {
                const dx = canvasStartPos.x - cx, dy = canvasStartPos.y - cy;
                const d = Math.sqrt(dx * dx + dy * dy);
                if (d < bestDist) { bestDist = d; bestIdx = -1; }
            }
            return bestDist < threshold ? bestIdx : null;
        }

        /* ---- Canvas mouse events ---- */
        (function setupCanvasEvents() {
            const cv = $('snapCanvas');

            cv.addEventListener('mousedown', e => {
                const { x, y } = canvasCoords(e);
                const hitRadius = 14;

                if (activeTool === 'add') {
                    const workZ = parseFloat($('workZ').value) || 0;
                    const workR = parseFloat($('workR').value) || 0;
                    let insertAt = detectedPath.length;
                    if (detectedPath.length >= 2) {
                        let bestDist = Infinity;
                        for (let i = 0; i < detectedPath.length; i++) {
                            const dx = detectedPath[i].x - x;
                            const dy = detectedPath[i].y - y;
                            const d = Math.sqrt(dx * dx + dy * dy);
                            if (d < bestDist) { bestDist = d; insertAt = i + 1; }
                        }
                    }
                    detectedPath.splice(insertAt, 0, { x, y, z: workZ, r: workR });
                    log(`Added waypoint #${insertAt + 1} at (${x.toFixed(0)}, ${y.toFixed(0)})`);
                    redrawCanvas();
                    return;
                }

                if (activeTool === 'delete') {
                    const idx = findNearestWaypoint(x, y, hitRadius);
                    if (idx !== null && idx >= 0) {
                        detectedPath.splice(idx, 1);
                        log(`Deleted waypoint #${idx + 1}`);
                        redrawCanvas();
                    }
                    return;
                }

                // 'move' tool
                const idx = findNearestWaypoint(x, y, hitRadius);
                if (idx !== null) {
                    draggingIdx = idx;
                    isDragging = true;
                    cv.style.cursor = 'grabbing';
                }
            });

            cv.addEventListener('mousemove', e => {
                if (!isDragging) return;
                const { x, y } = canvasCoords(e);
                if (draggingIdx === -1) {
                    // Dragging canvas start marker (pixel space only)
                    canvasStartPos = { x, y };
                } else if (draggingIdx >= 0 && draggingIdx < detectedPath.length) {
                    detectedPath[draggingIdx].x = x;
                    detectedPath[draggingIdx].y = y;
                }
                redrawCanvas();
            });

            cv.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    draggingIdx = -1;
                    if (activeTool === 'move') $('snapCanvas').style.cursor = 'grab';
                }
            });

            cv.addEventListener('mouseleave', () => {
                if (isDragging) {
                    isDragging = false;
                    draggingIdx = -1;
                    if (activeTool === 'move') $('snapCanvas').style.cursor = 'grab';
                }
            });
        })();

        /* ---- Streams ---- */
        async function toggleCamera() {
            const img = $('cameraFeed');
            cameraOn = !cameraOn;
            if (cameraOn) {
                img.src = `${api()}/streams/camera/feed`;
                img.onerror = () => { log('Camera feed error — check server / camera'); cameraOn = false; };
                log('Camera stream started');
            } else {
                img.src = '';
                img.onerror = null;
                try { await fetch(`${api()}/streams/camera`, { method: 'DELETE' }); } catch (_) { }
                log('Camera stream stopped');
            }
        }

        async function toggleDetection() {
            const img = $('detectionFeed');
            detectionOn = !detectionOn;
            if (detectionOn) {
                img.src = `${api()}/streams/detection/feed`;
                img.onerror = () => { log('Detection feed error — check server / camera'); detectionOn = false; };
                log('Detection stream started');
            } else {
                img.src = '';
                img.onerror = null;
                try { await fetch(`${api()}/streams/detection`, { method: 'DELETE' }); } catch (_) { }
                log('Detection stream stopped');
            }
        }

        /* ---- Path detection ---- */
        async function detectPath() {
            log('Detecting path…');
            try {
                const res = await fetch(`${api()}/paths`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ options: {} }),
                });
                const data = await res.json();
                log(`Path result: ok=${data.ok}, ${data.detections?.length ?? 0} detections, ` +
                    `pixelsPerMm=${data.pixelsPerMm ?? '?'}, markers=${data.markerCount ?? 0}`);

                lastDetections = data.detections || [];
                lastPixelsPerMm = data.pixelsPerMm || null;
                lastMarkerCorners = data.markerCorners || [];

                if (data.image_base64) {
                    const img = new Image();
                    img.onload = () => {
                        lastSnapshotImg = img;
                        buildPathFromCorners();
                        autoStartFromMarker();
                        redrawCanvas();
                    };
                    img.src = 'data:image/jpeg;base64,' + data.image_base64;
                } else {
                    buildPathFromCorners();
                    autoStartFromMarker();
                    redrawCanvas();
                }

            } catch (e) {
                log('Path detection error: ' + e.message);
            }
        }

        /* Build waypoint path from detected object corners (4 per object) */
        function buildPathFromCorners() {
            const workZ = parseFloat($('workZ').value) || 0;
            const workR = parseFloat($('workR').value) || 0;
            detectedPath = [];
            for (const det of lastDetections) {
                if (det.corners && det.corners.length >= 4) {
                    for (const c of det.corners) {
                        detectedPath.push({ x: c.x, y: c.y, z: workZ, r: workR });
                    }
                } else {
                    detectedPath.push({ x: det.center_x, y: det.center_y, z: workZ, r: workR });
                }
            }
            log(`Built path: ${detectedPath.length} waypoints from ${lastDetections.length} object(s)`);
            updatePathInfo();
        }

        /* Set canvas start marker 50 mm below the ArUco marker center (pixel space).
         * The arm starts 50 mm below the marker so the marker stays visible during detection.
         * The user must physically position the robot arm at this offset point,
         * then Read Position to pair the pixel anchor with robot mm. */
        function autoStartFromMarker() {
            if (!lastMarkerCorners || lastMarkerCorners.length === 0) {
                log('No ArUco markers — cannot auto-set canvas start marker');
                return;
            }
            const mc = lastMarkerCorners[0].corners;
            if (!mc || mc.length < 4) return;

            let cx = 0, cy = 0;
            for (const c of mc) { cx += c.x; cy += c.y; }
            cx /= mc.length;
            cy /= mc.length;

            // Store raw marker pixel center
            markerPixelCenter = { x: cx, y: cy };

            // Offset 50 mm downward in image (Y+) so the arm doesn't occlude the marker
            const offsetMm = 50;
            const offsetPx = lastPixelsPerMm ? (offsetMm * lastPixelsPerMm) : 50;
            const sy = cy + offsetPx;

            canvasStartPos = { x: cx, y: sy };
            log(`Canvas start marker set 50 mm below ArUco: pixel (${cx.toFixed(0)}, ${sy.toFixed(0)})`);
            log(`  Marker center: (${cx.toFixed(0)}, ${cy.toFixed(0)})px — offset: ${offsetMm} mm = ${offsetPx.toFixed(0)} px downward`);
            log('  → Move the robot arm to the orange diamond (50 mm below marker), then Read Position.');
            redrawCanvas();
        }

        function updatePathInfo() {
            let text = '';
            if (canvasStartPos) text += `Start marker: (${canvasStartPos.x.toFixed(0)}, ${canvasStartPos.y.toFixed(0)})px  →  `;
            if (robotStartPos) text += `Robot: (${robotStartPos.x.toFixed(1)}, ${robotStartPos.y.toFixed(1)})mm  |  `;
            text += detectedPath.length
                ? `${detectedPath.length} waypoint(s): ${detectedPath.map((w, i) => `#${i + 1}(${w.x.toFixed(0)},${w.y.toFixed(0)})`).join(' → ')}`
                : 'No path — click Detect or use Add tool';

            // Calibration status
            const calibOk = canCalibrate();
            text += calibOk
                ? '  ✓ calibrated'
                : '  ⚠ uncalibrated (need: canvas start + robot start + ppm)';
            $('pathInfo').textContent = text;
        }

        function clearAllWaypoints() {
            detectedPath = [];
            log('Path cleared');
            redrawCanvas();
        }

        /* ---- Canvas rendering ---- */
        function redrawCanvas() {
            const cv = $('snapCanvas');
            const ctx = cv.getContext('2d');

            if (lastSnapshotImg) {
                cv.width = lastSnapshotImg.width;
                cv.height = lastSnapshotImg.height;
                ctx.drawImage(lastSnapshotImg, 0, 0);
            } else {
                ctx.clearRect(0, 0, cv.width, cv.height);
            }

            // Detection boxes (cyan)
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 2;
            for (const det of lastDetections) {
                if (det.corners?.length >= 4) {
                    ctx.beginPath();
                    ctx.moveTo(det.corners[0].x, det.corners[0].y);
                    for (let i = 1; i < det.corners.length; i++)
                        ctx.lineTo(det.corners[i].x, det.corners[i].y);
                    ctx.closePath();
                    ctx.stroke();
                }
                ctx.strokeStyle = '#00ffff55';
                ctx.lineWidth = 1;
                const cx = det.center_x, cy = det.center_y;
                ctx.beginPath(); ctx.moveTo(cx - 6, cy); ctx.lineTo(cx + 6, cy); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx, cy - 6); ctx.lineTo(cx, cy + 6); ctx.stroke();
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 2;
            }

            // ArUco marker corners (magenta dashed)
            for (const mc of lastMarkerCorners) {
                if (mc.corners?.length >= 4) {
                    ctx.strokeStyle = '#ff55ff';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([4, 4]);
                    ctx.beginPath();
                    ctx.moveTo(mc.corners[0].x, mc.corners[0].y);
                    for (let i = 1; i < mc.corners.length; i++)
                        ctx.lineTo(mc.corners[i].x, mc.corners[i].y);
                    ctx.closePath();
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }

            // Waypoint path line (yellow dashed)
            if (detectedPath.length > 1) {
                ctx.strokeStyle = '#facc15';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([6, 4]);
                ctx.beginPath();
                ctx.moveTo(detectedPath[0].x, detectedPath[0].y);
                for (let i = 1; i < detectedPath.length; i++) {
                    ctx.lineTo(detectedPath[i].x, detectedPath[i].y);
                }
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Waypoint dots + labels
            for (let i = 0; i < detectedPath.length; i++) {
                const w = detectedPath[i];
                ctx.fillStyle = '#facc15';
                ctx.beginPath();
                ctx.arc(w.x, w.y, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;
                ctx.stroke();

                // Label: index + robot mm if calibrated
                let label = `#${i + 1}`;
                if (canCalibrate()) {
                    const workZ = parseFloat($('workZ').value) || 0;
                    const workR = parseFloat($('workR').value) || 0;
                    const rw = pixelToRobot(w.x, w.y, workZ, workR);
                    label += ` (${rw.x.toFixed(1)},${rw.y.toFixed(1)})`;
                }
                ctx.fillStyle = '#facc15';
                ctx.font = 'bold 11px system-ui';
                ctx.fillText(label, w.x + 9, w.y - 5);
            }

            // Canvas start marker (orange diamond) — pixel coordinates from ArUco marker
            if (canvasStartPos) {
                const sx = canvasStartPos.x, sy = canvasStartPos.y;
                const sz = 10;
                ctx.fillStyle = '#ff8c00';
                ctx.beginPath();
                ctx.moveTo(sx, sy - sz);
                ctx.lineTo(sx + sz, sy);
                ctx.lineTo(sx, sy + sz);
                ctx.lineTo(sx - sz, sy);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = '#ff8c00';
                ctx.font = 'bold 12px system-ui';
                ctx.fillText('START', sx + 14, sy + 4);

                if (detectedPath.length > 0) {
                    ctx.strokeStyle = '#ffffff88';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([8, 5]);
                    ctx.beginPath();
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(detectedPath[0].x, detectedPath[0].y);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }

            updatePathInfo();
        }

        /* ---- Robot Start Position (robot mm coordinates) ---- */
        function getRobotStartPos() {
            return robotStartPos;  // {x, y, z, r} in mm or null
        }

        /**
         * Check whether we have all three calibration ingredients:
         *  - canvasStartPos  (pixel anchor from ArUco auto-start)
         *  - robotStartPos   (mm anchor from Read Position)
         *  - lastPixelsPerMm (scale from ArUco detection)
         */
        function canCalibrate() {
            return !!(canvasStartPos && robotStartPos && lastPixelsPerMm);
        }

        /**
         * Convert canvas pixel coordinates → robot mm coordinates.
         *
         * Camera is mounted behind the arm:
         *   image bottom→top (Y decreasing)  =  robot +X
         *   image left→right (X increasing)  =  robot −Y
         *
         * @param {number} px  Pixel X on canvas
         * @param {number} py  Pixel Y on canvas
         * @param {number} workZ  Robot Z in mm
         * @param {number} workR  Robot R in mm
         * @returns {{x,y,z,r}}  Robot coordinates in mm
         */
        function pixelToRobot(px, py, workZ, workR) {
            const dpx = px - canvasStartPos.x;  // pixel delta X (+ = right)
            const dpy = py - canvasStartPos.y;  // pixel delta Y (+ = down)
            const ppm = lastPixelsPerMm;
            return {
                x: robotStartPos.x - (dpy / ppm),   // pixel Y↑ (dpy<0) → robot +X
                y: robotStartPos.y - (dpx / ppm),   // pixel X→ (dpx>0) → robot −Y
                z: workZ,
                r: workR,
            };
        }

        async function readPose() {
            log('Reading robot arm position…');
            try {
                const res = await fetch(`${api()}/robot/pose`);
                const data = await res.json();
                if (data.ok) {
                    robotStartPos = { x: data.x, y: data.y, z: data.z, r: data.r };
                    $('startX').value = data.x.toFixed(1);
                    $('startY').value = data.y.toFixed(1);
                    $('startZ').value = data.z.toFixed(1);
                    $('startR').value = data.r.toFixed(1);
                    $('poseInfo').textContent = `Robot position: (${data.x.toFixed(1)}, ${data.y.toFixed(1)}, ${data.z.toFixed(1)}, ${data.r.toFixed(1)}) mm`;
                    $('poseInfo').style.color = 'var(--green)';
                    log(`Robot pose (mm): x=${data.x.toFixed(1)} y=${data.y.toFixed(1)} z=${data.z.toFixed(1)} r=${data.r.toFixed(1)}`);
                    log(`  Joints: j1=${data.j1.toFixed(1)} j2=${data.j2.toFixed(1)} j3=${data.j3.toFixed(1)} j4=${data.j4.toFixed(1)}`);
                    // NOTE: does not redraw canvas — robot coords != pixel coords
                } else {
                    $('poseInfo').textContent = `Error: ${data.error || 'unknown'}`;
                    $('poseInfo').style.color = 'var(--red)';
                    log(`Robot pose error: ${data.error}`);
                }
            } catch (e) {
                $('poseInfo').textContent = `Error: ${e.message}`;
                $('poseInfo').style.color = 'var(--red)';
                log('Read pose error: ' + e.message);
            }
        }

        function clearRobotStart() {
            robotStartPos = null;
            $('startX').value = '';
            $('startY').value = '';
            $('startZ').value = '';
            $('startR').value = '';
            $('poseInfo').textContent = '';
            log('Robot start position cleared');
        }

        function clearStartingPoint() {
            canvasStartPos = null;
            markerPixelCenter = null;
            log('Canvas start marker cleared');
            redrawCanvas();
        }

        /* ---- Coordinate validation ---- */
        function validateCoords() {
            log('=== Coordinate Validation ===');

            // 1. Check calibration ingredients
            log(`  canvasStartPos: ${canvasStartPos ? `(${canvasStartPos.x.toFixed(1)}, ${canvasStartPos.y.toFixed(1)}) px` : 'MISSING'}`);
            log(`  robotStartPos:  ${robotStartPos ? `(${robotStartPos.x.toFixed(1)}, ${robotStartPos.y.toFixed(1)}, ${robotStartPos.z.toFixed(1)}, ${robotStartPos.r.toFixed(1)}) mm` : 'MISSING'}`);
            log(`  pixelsPerMm:    ${lastPixelsPerMm ? lastPixelsPerMm.toFixed(4) : 'MISSING'}`);
            log(`  markerPixelCtr: ${markerPixelCenter ? `(${markerPixelCenter.x.toFixed(1)}, ${markerPixelCenter.y.toFixed(1)}) px` : 'n/a'}`);

            if (!canCalibrate()) {
                log('  ⚠ Calibration incomplete — cannot convert coordinates.');
                log('  Workflow: 1) Detect (ArUco → canvasStartPos + ppm)  2) Move arm to start marker  3) Read Position');
                return;
            }

            // 2. Self-test: canvasStartPos should map back to robotStartPos
            const workZ = parseFloat($('workZ').value) || 0;
            const workR = parseFloat($('workR').value) || 0;
            const selfTest = pixelToRobot(canvasStartPos.x, canvasStartPos.y, workZ, workR);
            const dx = Math.abs(selfTest.x - robotStartPos.x);
            const dy = Math.abs(selfTest.y - robotStartPos.y);
            log(`  Self-test: canvasStart → robot (${selfTest.x.toFixed(2)}, ${selfTest.y.toFixed(2)}) mm` +
                ` vs actual (${robotStartPos.x.toFixed(2)}, ${robotStartPos.y.toFixed(2)}) mm` +
                ` Δ=(${dx.toFixed(3)}, ${dy.toFixed(3)}) ${dx < 0.01 && dy < 0.01 ? '✓ OK' : '⚠ MISMATCH'}`);

            // 3. Axis orientation check
            const testRight = pixelToRobot(canvasStartPos.x + 100, canvasStartPos.y, workZ, workR);
            const testDown = pixelToRobot(canvasStartPos.x, canvasStartPos.y + 100, workZ, workR);
            log(`  Axis test: 100px RIGHT → robot Δx=${(testRight.x - robotStartPos.x).toFixed(2)}, Δy=${(testRight.y - robotStartPos.y).toFixed(2)} mm  (expect Δx≈0, Δy<0)`);
            log(`  Axis test: 100px DOWN  → robot Δx=${(testDown.x - robotStartPos.x).toFixed(2)}, Δy=${(testDown.y - robotStartPos.y).toFixed(2)} mm  (expect Δx<0, Δy≈0)`);

            // 4. Convert all waypoints
            if (!detectedPath.length) {
                log('  No waypoints to convert.');
                return;
            }
            log(`  --- ${detectedPath.length} waypoint conversions ---`);
            for (let i = 0; i < detectedPath.length; i++) {
                const w = detectedPath[i];
                const rw = pixelToRobot(w.x, w.y, workZ, workR);
                const dpx = (w.x - canvasStartPos.x).toFixed(1);
                const dpy = (w.y - canvasStartPos.y).toFixed(1);
                log(`  WP#${i + 1}: px(${w.x.toFixed(0)},${w.y.toFixed(0)}) Δpx(${dpx},${dpy}) → robot(${rw.x.toFixed(2)},${rw.y.toFixed(2)}) mm`);
            }
            log('=== End Validation ===');
            redrawCanvas();  // refresh labels with robot coords
        }

        async function testMoveToWP() {
            if (!canCalibrate()) {
                log('⚠ Cannot test move — calibration incomplete.');
                return;
            }
            if (!detectedPath.length) {
                log('⚠ No waypoints — add or detect waypoints first.');
                return;
            }
            const workZ = parseFloat($('workZ').value) || 0;
            const workR = parseFloat($('workR').value) || 0;
            const rw = pixelToRobot(detectedPath[0].x, detectedPath[0].y, workZ, workR);
            log(`Test Move: sending robot to WP#1 → (${rw.x.toFixed(2)}, ${rw.y.toFixed(2)}, ${workZ}, ${workR}) mm`);
            log(`  (pixel source: ${detectedPath[0].x.toFixed(0)}, ${detectedPath[0].y.toFixed(0)})`);
            try {
                const res = await fetch(`${api()}/robot/move`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ x: rw.x, y: rw.y, z: workZ, r: workR }),
                });
                const data = await res.json();
                if (data.ok) {
                    log('  ✓ Move command sent. Check physical robot position vs expected.');
                } else {
                    log(`  ✗ Move failed: ${data.error}`);
                }
            } catch (e) {
                log('  Test move error: ' + e.message);
            }
        }

        /* ---- Job launch with confirmation ---- */
        function requestStart(dryRun) {
            if (!detectedPath.length) {
                log('No path — run detection first or add waypoints manually.');
                return;
            }
            if (!canCalibrate()) {
                const missing = [];
                if (!canvasStartPos) missing.push('canvas start marker (run Detect with ArUco)');
                if (!robotStartPos) missing.push('robot start position (Read Position)');
                if (!lastPixelsPerMm) missing.push('pixelsPerMm (run Detect with ArUco)');
                log('⚠ Cannot launch — calibration incomplete. Missing: ' + missing.join(', '));
                return;
            }

            const rsp = getRobotStartPos();
            pendingDryRun = dryRun;

            // Preview first & last converted waypoint for sanity check
            const workZ = parseFloat($('workZ').value) || 0;
            const workR = parseFloat($('workR').value) || 0;
            const first = pixelToRobot(detectedPath[0].x, detectedPath[0].y, workZ, workR);
            const last = pixelToRobot(detectedPath[detectedPath.length - 1].x, detectedPath[detectedPath.length - 1].y, workZ, workR);

            const banner = $('confirmBanner');
            banner.style.display = 'block';
            $('confirmBtn').textContent = dryRun ? 'Confirm & Dry Run' : 'Confirm & Start';
            $('confirmDetail').textContent =
                `${detectedPath.length} waypoints (pixel → robot mm)` +
                ` | Robot start: (${rsp.x.toFixed(1)}, ${rsp.y.toFixed(1)}, ${rsp.z.toFixed(1)}) mm` +
                ` | First WP: (${first.x.toFixed(1)}, ${first.y.toFixed(1)}) mm` +
                ` | Last WP: (${last.x.toFixed(1)}, ${last.y.toFixed(1)}) mm` +
                ` | ppm=${lastPixelsPerMm.toFixed(2)}` +
                ` | ${dryRun ? 'DRY RUN' : 'REAL MOVEMENT'}`;
        }

        function cancelConfirm() {
            $('confirmBanner').style.display = 'none';
            log('Job launch cancelled');
        }

        async function confirmJob() {
            $('confirmBanner').style.display = 'none';
            await startJob(pendingDryRun);
        }

        async function startJob(dryRun) {
            const workZ = parseFloat($('workZ').value) || 0;
            const workR = parseFloat($('workR').value) || 0;

            // Convert pixel waypoints → robot mm using calibration
            const path = detectedPath.map((w, i) => {
                const rw = pixelToRobot(w.x, w.y, workZ, workR);
                if (i < 3 || i === detectedPath.length - 1) {
                    log(`  WP#${i + 1}: pixel(${w.x.toFixed(0)},${w.y.toFixed(0)}) → robot(${rw.x.toFixed(1)},${rw.y.toFixed(1)}) mm`);
                }
                return rw;
            });

            const body = { path, dryRun: dryRun };
            const rsp = getRobotStartPos();
            if (rsp) {
                body.startingPoint = rsp;
                log(`Robot start (mm): (${rsp.x.toFixed(1)}, ${rsp.y.toFixed(1)}, ${rsp.z.toFixed(1)}, ${rsp.r.toFixed(1)})`);
            }
            log(`Calibration: canvasStart=(${canvasStartPos.x.toFixed(0)},${canvasStartPos.y.toFixed(0)})px  robotStart=(${rsp.x.toFixed(1)},${rsp.y.toFixed(1)})mm  ppm=${lastPixelsPerMm.toFixed(2)}`);

            // Capture canvas snapshot as base64
            try {
                const cv = $('snapCanvas');
                const dataUrl = cv.toDataURL('image/jpeg', 0.85);
                body.imageBase64 = dataUrl.split(',')[1];
            } catch (_) { }

            log(`Starting ${dryRun ? 'DRY RUN' : 'REAL'} job with ${path.length} waypoints${rsp ? ' + robot start' : ''}…`);
            try {
                const res = await fetch(`${api()}/jobs`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                const job = await res.json();
                currentJobId = job.id;
                log(`Job created: ${job.id}  state=${job.status?.state}  waypoints=${job.path?.length}`);
                renderJobStatus(job);
                startPolling();
            } catch (e) {
                log('Job creation error: ' + e.message);
            }
        }

        async function stopJob() {
            try {
                await fetch(`${api()}/robot/stop`, { method: 'POST' });
                log('Stop requested');
            } catch (e) {
                log('Stop error: ' + e.message);
            }
        }

        /* ---- Polling ---- */
        function startPolling() {
            stopPolling();
            pollTimer = setInterval(pollJob, 800);
        }
        function stopPolling() {
            if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        }

        async function pollJob() {
            if (!currentJobId) return;
            try {
                const res = await fetch(`${api()}/jobs/${currentJobId}`);
                const job = await res.json();
                renderJobStatus(job);
                if (['completed', 'failed', 'stopped'].includes(job.status?.state)) {
                    stopPolling();
                    log(`Job finished: ${job.status.state}`);
                }
            } catch (e) {
                log('Poll error: ' + e.message);
            }
        }

        function renderJobStatus(job) {
            const s = job.status || {};
            $('jobStatus').innerHTML =
                `<span class="status-pill state-${s.state || 'created'}">${(s.state || 'created').toUpperCase()}</span>` +
                ` &nbsp; Job: <code>${job.id?.slice(0, 8)}…</code>`;
            $('jobProgress').textContent =
                `Processed: ${s.lastPointProcessed ?? 0} / ${job.path?.length ?? 0}` +
                (s.error ? `  —  Error: ${s.error}` : '') +
                (job.dryRun ? '  (dry run)' : '');

            const tbody = $('measurementsBody');
            tbody.innerHTML = '';
            for (const m of (job.measurements || [])) {
                const w = m.waypoint || {};
                const scanStr = m.scanResult ? JSON.stringify(m.scanResult).slice(0, 80) : '—';
                tbody.innerHTML += `<tr>
      <td>${m.waypointIndex}</td>
      <td>${w.x?.toFixed(1)}</td><td>${w.y?.toFixed(1)}</td>
      <td>${w.z?.toFixed(1)}</td><td>${w.r?.toFixed(1)}</td>
      <td>${m.simulated ? 'Yes' : 'No'}</td>
      <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis">${scanStr}</td>
      <td>${m.timestamp ? new Date(m.timestamp).toLocaleTimeString() : '—'}</td>
    </tr>`;
            }
        }
    </script>
</body>

</html>
